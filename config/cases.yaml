# P06 Detective Cases configuration (owned by P06).
#
# Numbers in cases.json are always computed from the P03/P08 grids.  This file
# may only change selection thresholds and human wording; it must never contain
# data values.  Keys under `overrides` are case ids (`case-01`, ...) and may
# only set `title` and/or `why_selected`.

# Minimum number of eligible cells in a connected 8-neighbour cluster.
min_cluster_cells: 15

# Selection set size.  The algorithm tries to cover the four story categories
# (IMERG precipitation, opposite-direction pair, multi-variable pattern,
# Southeast Asia / Mekong) and fills up to max_cases with the best remaining
# distinct variable/window candidates.
target_cases: 4
max_cases: 6

# P06b selection rules (fixed in earthpulse/cases.py):
# - 12-year candidates also use the 2001-2024 quality layer of the same
#   variable, because 12 annual values have little power to detect a step.
# - Full 2001-2024 candidates rank with a x1.25 score bonus, so they win when
#   their raw score is within 20% of a shorter-window candidate.
# - specific_humidity in 2001-2012 is down-weighted by x0.5 because
#   REAL_RUN_REVIEW documents an early-period drop in that GLDAS field.
# - The Southeast Asia slot prefers Vietnam, then the Mekong box, then the
#   remaining Southeast Asia candidates; it is omitted if no candidate has at
#   least min_cluster_cells eligible cells.
# P06c:
# - Every case gets a plain-language summary (why_selected = summary) and the
#   technical selection text moves to details.
# - region.label and title use the country holding most cells (from the 1.2
#   country grid); coordinates are only a fallback.
# - quality_flag_share is the area share of the source cells with
#   quality_flag >= 1.
# - Exactly one caution case is added for Vietnam air temperature 2001-2024,
#   using the whole country domain and including flagged cells. It is only
#   built when that trend is significantly warming; otherwise the normal
#   Southeast Asia rule is used.
# P06e:
# - When a witness agreement layer exists, finding scores are multiplied by
#   (0.5 + 0.5 x corroborated share) so corroborated clusters win ties.
# - A finding is never selected when more than half of its cells are
#   contradicted (agreement code -2).
# - The Vietnam air-temperature caution summary adds the witness verdict
#   from the section 13 combined reading. Real cases are rebuilt only after
#   P14 publishes the witness grids.
# P06f (WAVE3_REVIEW round 1):
# - The opposite-direction pair requires witness majority code 2 and a
#   contradicted area share below 20% on both sides. Pair preference is
#   precipitation, then 2001-2024, then other variables; the two sides must
#   have different place labels. If no pair qualifies, skip it and print the
#   reason.
# - The Vietnam caution summary reports both slopes, the flagged area share,
#   the break year and the lasting shift (mean after the break minus mean
#   before it) for GLDAS and MERRA-2; the lasting shift is also in details.
# - A second global caution case for specific humidity 2001-2024 reports the
#   GLDAS decreasing area, MERRA-2 increasing area and contradicted share.

# Wording-only overrides, for example:
# overrides:
#   case-01:
#     title: "A human-written title"
#     why_selected: "Human-written wording that keeps every computed number."
overrides: {}
